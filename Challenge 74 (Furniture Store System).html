<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
  <div class='container d-flex flex-wrap' id="container">

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    // const Customer = "HEMA";
    // const Product = "Wardrobe";
    // const Quantity = 1;
    // const Installation = "yes";
    // const Price = 5000;
    const container = document.getElementById("container");
    const allData = [
      {
        id: 1,
        Customer: "HEMA",
        Product: "Wardrobe",
        Quantity: 1,
        Installation: "yes",
        Price: 5000,
      },
      {
        id: 2,
        Customer: "Ahmed",
        Product: "Sofa",
        Quantity: 3,
        Installation: "no",
        Price: 8000,
      },
      {
        id: 3,
        Customer: "Sara",
        Product: "Bed",
        Quantity: 5,
        Installation: "yes",
        Price: 6000,
      },
      {
        id: 4,
        Customer: "Ali",
        Product: "Table",
        Quantity: 0, // ⚠️ قيمة خاطئة لاختبار التحقق
        Installation: "yes",
        Price: 1500,
      },
      {
        id: 5,
        Customer: "Mona",
        Product: "Chair",
        Quantity: 2,
        Installation: "yes",
        Price: 20000, // ⚠️ سعر عالي لاختبار الخصم
      }
    ];
    function furnitureStoreSystem(data) {
      const { Customer, Product, Quantity, Installation, Price } = data
      let Total = Price * Quantity;
      let Discount = 0;
      let FinalPrice;
      let complete = true;

      if (!Number.isFinite(Price) || Price <= 0) { complete = false };
      if (!Number.isFinite(Quantity) || Quantity <= 0) { complete = false };
      if (complete) {

        if (Installation.toLowerCase() === "yes") { Total += 500 };
        if (Total > 25000) { Discount = Total * 0.12 };

        FinalPrice = Total - Discount;

        return `
        <div  class="p-3 m-3 bg-primary" style="width: 300px;">
          <p><strong>Customer :</strong> ${Customer}</p>
          <p><strong>Product :</strong> ${Product}</p>
          <p><strong>Quantity :</strong> ${Quantity}</p>
          <p><strong>Installation :</strong> ${Installation}</p>
          <p><strong>Total :</strong> ${Total}</p>
          <p><strong>Discount :</strong> ${Discount}</p>
          <p><strong>FinalPrice :</strong> ${FinalPrice}</p>
        </div>
        <hr>
        `
      }
      if (!complete) {
        return `
    <div class="p-3 m-3 bg-danger text-white" style="width: 300px;">
      <p><strong>Customer :</strong> ${Customer}</p>
      <p><strong>Product :</strong> ${Product}</p>
      <p>⚠️ بيانات غير صحيحة (السعر أو الكمية)</p>
    </div>
    <hr>`;
      }

    }
    let text = ""
    for (const data of allData) {
      text += furnitureStoreSystem(data)
    }
    container.innerHTML = text
  </script>
</body>

</html>
