<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
  <div class="container" id="container">

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    // const Customer = "HEMA";
    // const Product = "Wardrobe";
    // const Quantity = 1;
    // const Installation = "yes";
    // const Price = 5000;
    const container = document.getElementById("container");
    const allData = [
      {
        id: 1,
        Customer: "HEMA",
        Product: "Wardrobe",
        Quantity: 1,
        Installation: "yes",
        Price: 5000,
      },
      {
        id: 2,
        Customer: "Ahmed",
        Product: "Sofa",
        Quantity: 3,
        Installation: "no",
        Price: 8000,
      },
      {
        id: 3,
        Customer: "Sara",
        Product: "Bed",
        Quantity: 5,
        Installation: "yes",
        Price: 6000,
      },
      {
        id: 4,
        Customer: "Ali",
        Product: "Table",
        Quantity: 0, // ⚠️ قيمة خاطئة لاختبار التحقق
        Installation: "yes",
        Price: 1500,
      },
      {
        id: 5,
        Customer: "Mona",
        Product: "Chair",
        Quantity: 2,
        Installation: "yes",
        Price: 20000, // ⚠️ سعر عالي لاختبار الخصم
      }
    ];
    // (Customer, Product, Quantity, Installation, Price)
    function furnitureStoreSystem(data) {
      const { Customer, Product, Quantity, Installation, Price } = data
      let Total = Price * Quantity;
      let Discount = 0;
      let FinalPrice;
      let complet = true;

      if (isNaN(Price) || Price <= 0) { complet = false };
      if (isNaN(Quantity) || Quantity <= 0) { complet = false };
      if (complet) {

        if (Installation.toLowerCase() === "yes") { Total = Total + 500 };
        if (Total > 25000) { Discount = Total * 0.12 };

        FinalPrice = Total - Discount;

        return `
        <h5>Customer : ${Customer}</h5>
        <h5>Product : ${Product}</h5>
        <h5>Quantity : ${Quantity}</h5>
        <h5>Installation : ${Installation}</h5>
        <h5>Total : ${Total}</h5>
        <h5>Discount : ${Discount}</h5>
        <h5>FinalPrice : ${FinalPrice}</h5>
        <hr>
        `
        console.log(`Customer : ${Customer}`);
        console.log(`Product : ${Product}`);
        console.log(`Quantity : ${Quantity}`);
        console.log(`Installation : ${Installation}`);
        console.log(`Total : ${Total}`);
        console.log(`Discount : ${Discount}`);
        console.log(`FinalPrice : ${FinalPrice}`);
      }

    }
    text = ""
    for (const data of allData) {
      text += furnitureStoreSystem(data)
    }
    container.innerHTML = text
  </script>
</body>

</html>
